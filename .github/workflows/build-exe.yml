name: Build CrashLens.exe

# Builds a single-file Windows app on every push to main and publishes it on the
# repository's Releases page ("latest" release) as a plain CrashLens.exe download.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[gui,build]"
      - run: python packaging/build.py
      - name: Self-test the command-line exe
        run: dist\crashlens-cli.exe --demo scan
      - name: Self-test the app exe (opens offscreen, runs a demo check, closes)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\CrashLens.exe -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "CrashLens.exe self-test failed with exit code $($p.ExitCode)" }
      - name: Read-only check of this Windows machine
        run: dist\crashlens-cli.exe scan --days 7
      - uses: actions/upload-artifact@v4
        with:
          name: CrashLens-exe
          path: |
            dist/CrashLens.exe
            dist/crashlens-cli.exe
          retention-days: 30
      - name: Publish CrashLens.exe on the Releases page
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $notes = "Download **CrashLens.exe** below and double-click it. No installing needed.`n`nBuilt from $sha. Windows may show a blue 'Windows protected your PC' box the first time: click **More info**, then **Run anyway**."
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest dist/CrashLens.exe dist/crashlens-cli.exe --title "CrashLens (latest)" --notes $notes --latest
          } else {
            gh release upload latest dist/CrashLens.exe dist/crashlens-cli.exe --clobber
            gh release edit latest --notes $notes
          }
          git push origin "+HEAD:refs/tags/latest" 2>$null
          exit 0

